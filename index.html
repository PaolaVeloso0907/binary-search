<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>

    <title>Binary Search | Home</title>
</head>

<body>
    <div class="main">
        <div id="content-before">
            <h1><strong>BINARY SEARCH</strong></h1>
            <p>Clique no botão para começar!</p>
            <button class="btn-start" onclick="comecar()">COMEÇAR</button>
        </div>

        <div id="content-after">
            <div class="all-result">

                <p class="result">Série de números:
                <p class="result-num" id="exibir">
                </p>
                </p>

                <div class="btn-after">
                    <button class="btn-start" onclick="gerarNum()">Gerar Nova Sequência</button>
                    <button class="btn-start" onclick="ordenarNum()">Ordenar Números</button>
                    <button class="btn-start" onclick="buscar()">Buscar Posição</button>
                </div>
            </div>

        </div>

        <div id="content-search">
            <div class="all-result">
                <p>Digite um número e exibirei a posição dele na lista:</p>
                <br>
                <input type="text" id="ipt_number" placeholder="Ex: 3...">

                <div class="btn-after">
                    <button class="btn-start" onclick="buscarPosicao()">Buscar</button>
                </div>
            </div>
        </div>

        <div id="content-resultSearch">
            <div class="all-result">
                <p>A posição do número digitado é: </p>
                <p class="result-num" id="exibirPosicao">

                <div class="btn-after">
                    <button class="btn-start" onclick="voltar()">Voltar</button>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
